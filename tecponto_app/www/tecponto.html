{% extends "templates/web.html" %}

{% block title %}Tecponto{% endblock %}

{% block header %}{% endblock %}

{% block style %}
<style>
	html,
	body {
		background: #15181b;
	}

	.navbar,
	.web-footer,
	.page-breadcrumbs {
		display: none !important;
	}

	#page-tecponto,
	.page-content-wrapper,
	.page-content-wrapper > .container,
	.web-page-content {
		margin: 0 !important;
		max-width: none !important;
		padding: 0 !important;
		width: 100% !important;
	}

	#tecponto-root {
		margin: 0 !important;
		max-width: none !important;
		width: 100% !important;
	}
</style>
<link rel="stylesheet" href="/assets/tecponto_app/frontend/assets/app.css?v={{ build_version or 'local' }}">
{% endblock %}

{% block page_content %}
<div id="tecponto-root"></div>
<script>
	window.tecpontoBoot = {
		csrfToken: "{{ frappe.session.csrf_token }}",
		site: "{{ frappe.local.site }}",
	};
</script>
<script type="module" src="/assets/tecponto_app/frontend/assets/app.js?v={{ build_version or 'local' }}"></script>
{% endblock %}
