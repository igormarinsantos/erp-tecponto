name: Validate, integrate and publish Tecponto production image

on:
  workflow_dispatch:
  pull_request:
    branches: [version-16]
  push:
    branches: [version-16]
    paths:
      - "tecponto_app/**"
      - "frontend/**"
      - "deployment/**"
      - ".github/workflows/publish-image.yml"

jobs:
  changes:
    name: Detect runtime image changes
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.filter.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            runtime:
              - 'deployment/Containerfile'
              - 'deployment/apps.production.json'
              - 'deployment/**/requirements*.txt'

  validate:
    name: Fast frontend and Python validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tecponto
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Typecheck, build and frontend guards
        working-directory: frontend
        run: |
          npm ci --include=dev
          npm run build

      - name: Compile Python application sources
        run: python3 -m compileall -q tecponto_app

  integration:
    name: Full Frappe integration suite
    needs: [changes, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:6.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout Tecponto
        uses: actions/checkout@v4
        with:
          path: tecponto

      - name: Log in to GHCR for the published runtime image
        if: needs.changes.outputs.runtime != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published runtime image
        if: needs.changes.outputs.runtime != 'true'
        run: docker pull ghcr.io/${{ github.repository_owner }}/erp-tecponto:version-16

      - name: Checkout frappe_docker build context
        if: needs.changes.outputs.runtime == 'true'
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: main
          path: frappe_docker

      - name: Prepare BuildKit secrets
        if: needs.changes.outputs.runtime == 'true'
        shell: bash
        env:
          BUILD_TOKEN: ${{ github.token }}
        run: |
          cp tecponto/deployment/apps.production.json "$RUNNER_TEMP/apps.json"
          printf '[url "https://x-access-token:%s@github.com/"]\n\tinsteadOf = https://github.com/\n' "$BUILD_TOKEN" > "$RUNNER_TEMP/gitconfig"
          chmod 600 "$RUNNER_TEMP/apps.json" "$RUNNER_TEMP/gitconfig"

      - name: Set up Buildx for runtime changes
        if: needs.changes.outputs.runtime == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build an ephemeral runtime image when its definition changed
        if: needs.changes.outputs.runtime == 'true'
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: ${{ github.workspace }}/tecponto/deployment/Containerfile
          load: true
          push: false
          tags: tecponto-ci:${{ github.sha }}
          build-args: |
            FRAPPE_BRANCH=version-16
            FRAPPE_IMAGE_PREFIX=frappe
          secret-files: |
            apps_json=${{ runner.temp }}/apps.json
            git_config=${{ runner.temp }}/gitconfig

      - name: Create an ephemeral Frappe site and run the full Tecponto suite
        env:
          CI_IMAGE: ${{ needs.changes.outputs.runtime == 'true' && format('tecponto-ci:{0}', github.sha) || format('ghcr.io/{0}/erp-tecponto:version-16', github.repository_owner) }}
        run: |
          cat > "$RUNNER_TEMP/run-frappe-suite.sh" <<'SCRIPT'
          set -euo pipefail

          export SITE_NAME=ci.local
          export DB_ROOT_PASSWORD=ci-root-password
          cd /home/frappe/frappe-bench

          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:6379
          bench set-config -g redis_queue redis://127.0.0.1:6379
          bench set-config -g redis_socketio redis://127.0.0.1:6379

          bench new-site "$SITE_NAME" \
            --mariadb-root-password "$DB_ROOT_PASSWORD" \
            --db-root-username root \
            --admin-password ci-admin-password \
            --mariadb-user-host-login-scope '%' \
            --install-app erpnext \
            --set-default

          bench --site "$SITE_NAME" install-app hrms

          ./env/bin/python - "$SITE_NAME" <<'PY'
          import os
          import sys

          import frappe

          sites_path = "/home/frappe/frappe-bench/sites"
          os.chdir(sites_path)
          frappe.init(site=sys.argv[1], sites_path=sites_path)
          frappe.connect()
          frappe.set_user("Administrator")
          from frappe.desk.page.setup_wizard.setup_wizard import setup_complete
          setup_complete('{"country":"Brazil","company_name":"CI Repair","company_abbr":"CIR","currency":"BRL","timezone":"America/Sao_Paulo","fy_start_date":"2026-01-01","fy_end_date":"2026-12-31","chart_of_accounts":"Standard"}')
          from tecponto_app.install import bootstrap_erpnext_foundation
          bootstrap_erpnext_foundation()
          frappe.db.commit()
          frappe.destroy()
          PY

          bench --site "$SITE_NAME" install-app tecponto_app
          bench --site "$SITE_NAME" migrate
          bench --site "$SITE_NAME" execute tecponto_app.tecponto.frontend.test_frontend_api.run_foundation_checks
          SCRIPT
          chmod +x "$RUNNER_TEMP/run-frappe-suite.sh"
          docker run --rm --network host \
            --volume "$GITHUB_WORKSPACE/tecponto:/home/frappe/frappe-bench/apps/tecponto_app:ro" \
            --volume "$RUNNER_TEMP/run-frappe-suite.sh:/tmp/run-frappe-suite.sh:ro" \
            --entrypoint bash \
            "$CI_IMAGE" /tmp/run-frappe-suite.sh

  publish:
    name: Publish GHCR image
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/version-16'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Tecponto
        uses: actions/checkout@v4
        with:
          path: tecponto

      - name: Checkout frappe_docker build context
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: main
          path: frappe_docker

      - name: Prepare BuildKit secrets
        shell: bash
        env:
          BUILD_TOKEN: ${{ github.token }}
        run: |
          cp tecponto/deployment/apps.production.json "$RUNNER_TEMP/apps.json"
          printf '[url "https://x-access-token:%s@github.com/"]\n\tinsteadOf = https://github.com/\n' "$BUILD_TOKEN" > "$RUNNER_TEMP/gitconfig"
          chmod 600 "$RUNNER_TEMP/apps.json" "$RUNNER_TEMP/gitconfig"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/erp-tecponto
          tags: |
            type=raw,value=version-16
            type=sha,prefix=sha-

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: ${{ github.workspace }}/tecponto/deployment/Containerfile
          push: true
          build-args: |
            FRAPPE_BRANCH=version-16
            FRAPPE_IMAGE_PREFIX=frappe
          secret-files: |
            apps_json=${{ runner.temp }}/apps.json
            git_config=${{ runner.temp }}/gitconfig
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
