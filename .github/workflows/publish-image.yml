name: Publish Tecponto production image

on:
  workflow_dispatch:
  push:
    branches: [version-16]
    paths:
      - "tecponto_app/**"
      - "frontend/**"
      - "deployment/**"
      - ".github/workflows/publish-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tecponto
        uses: actions/checkout@v4
        with:
          path: tecponto

      - name: Checkout frappe_docker build context
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: main
          path: frappe_docker

      - name: Prepare BuildKit secrets
        shell: bash
        env:
          BUILD_TOKEN: ${{ github.token }}
        run: |
          cp tecponto/deployment/apps.production.json "$RUNNER_TEMP/apps.json"
          printf '[url "https://x-access-token:%s@github.com/"]\n\tinsteadOf = https://github.com/\n' "$BUILD_TOKEN" > "$RUNNER_TEMP/gitconfig"
          chmod 600 "$RUNNER_TEMP/apps.json" "$RUNNER_TEMP/gitconfig"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/erp-tecponto
          tags: |
            type=raw,value=version-16
            type=sha,prefix=sha-

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: ${{ github.workspace }}/tecponto/deployment/Containerfile
          push: true
          build-args: |
            FRAPPE_BRANCH=version-16
            FRAPPE_IMAGE_PREFIX=frappe
          secret-files: |
            apps_json=${{ runner.temp }}/apps.json
            git_config=${{ runner.temp }}/gitconfig
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
