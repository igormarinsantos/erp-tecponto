name: tecponto

x-image: &image
  image: ${FRAPPE_IMAGE:?Defina FRAPPE_IMAGE no Coolify}
  pull_policy: always
  restart: unless-stopped

x-bench: &bench
  <<: *image
  volumes:
    - tecponto-sites:/home/frappe/frappe-bench/sites
    - tecponto-logs:/home/frappe/frappe-bench/logs

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no Coolify}
      MARIADB_AUTO_UPGRADE: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - tecponto-db:/var/lib/mysql

  redis-cache:
    image: redis:8.6-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:8.6-alpine
    restart: unless-stopped
    volumes:
      - tecponto-redis-queue:/data

  configurator:
    <<: *bench
    restart: on-failure
    entrypoint: ["bash", "-c"]
    command:
      - >-
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
        bench set-config -g chromium_path /usr/bin/chromium-headless-shell;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  create-site:
    <<: *bench
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -eu
        cd /home/frappe/frappe-bench
        if [ -f "sites/$$SITE_NAME/.tecponto_bootstrapped" ]; then
          echo "Site $$SITE_NAME already bootstrapped"
        else
          bench new-site "$$SITE_NAME" \
            --mariadb-user-host-login-scope='%' \
            --admin-password="$$SITE_ADMIN_PASSWORD" \
            --db-root-username=root \
            --db-root-password="$$DB_PASSWORD" \
            --install-app erpnext \
            --set-default
          ./env/bin/python - "$$SITE_NAME" <<'PY'
        import frappe
        import os
        import sys
        from frappe.desk.page.setup_wizard.setup_wizard import setup_complete

        sites_path = "/home/frappe/frappe-bench/sites"
        os.chdir(sites_path)
        frappe.init(site=sys.argv[1], sites_path=sites_path)
        frappe.connect()
        frappe.set_user("Administrator")
        setup_complete('{"country":"Brazil","company_name":"Tecponto","company_abbr":"TEC","currency":"BRL","timezone":"America/Sao_Paulo","fy_start_date":"2026-01-01","fy_end_date":"2026-12-31","chart_of_accounts":"Standard"}')
        from tecponto_app.install import bootstrap_erpnext_foundation
        bootstrap_erpnext_foundation()
        frappe.db.commit()
        frappe.destroy()
        PY
          bench --site "$$SITE_NAME" install-app tecponto_app
          touch "sites/$$SITE_NAME/.tecponto_bootstrapped"
        fi
    environment:
      SITE_NAME: ${SERVICE_FQDN_FRONTEND_8080:?FQDN gerada pelo Coolify}
      SITE_ADMIN_PASSWORD: ${SITE_ADMIN_PASSWORD:?Defina SITE_ADMIN_PASSWORD no Coolify}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no Coolify}
    depends_on:
      configurator:
        condition: service_completed_successfully

  migrate:
    <<: *bench
    restart: on-failure:5
    entrypoint: ["bash", "-c"]
    command: ["bench --site $$SITE_NAME migrate"]
    environment:
      SITE_NAME: ${SERVICE_FQDN_FRONTEND_8080:?FQDN gerada pelo Coolify}
    depends_on:
      create-site:
        condition: service_completed_successfully

  backend:
    <<: *bench
    environment:
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    depends_on:
      migrate:
        condition: service_completed_successfully

  websocket:
    <<: *bench
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  queue-short:
    <<: *bench
    command: ["bench", "worker", "--queue", "short,default"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  queue-long:
    <<: *bench
    command: ["bench", "worker", "--queue", "long,default,short"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *bench
    command: ["bench", "schedule"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    <<: *image
    command: ["nginx-entrypoint.sh"]
    expose: ["8080"]
    labels:
      - traefik.enable=true
      - "traefik.http.routers.tecponto-frontend.rule=Host(`${SERVICE_FQDN_FRONTEND_8080}`)"
      - traefik.http.routers.tecponto-frontend.entrypoints=https
      - traefik.http.routers.tecponto-frontend.tls=true
      - traefik.http.routers.tecponto-frontend.tls.certresolver=letsencrypt
      - traefik.http.services.tecponto-frontend.loadbalancer.server.port=8080
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SERVICE_FQDN_FRONTEND_8080:?FQDN gerada pelo Coolify}
      UPSTREAM_REAL_IP_ADDRESS: "127.0.0.1"
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: "50m"
    volumes:
      - tecponto-sites:/home/frappe/frappe-bench/sites
      - tecponto-logs:/home/frappe/frappe-bench/logs
    depends_on:
      backend:
        condition: service_started
      websocket:
        condition: service_started

volumes:
  tecponto-db:
  tecponto-redis-queue:
  tecponto-sites:
  tecponto-logs:
