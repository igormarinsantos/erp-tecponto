services:
  configure:
    image: '${FRAPPE_IMAGE:-ghcr.io/igormarinsantos/erp-tecponto:version-16}'
    pull_policy: always
    deploy:
      restart_policy:
        condition: none
    entrypoint:
      - bash
      - '-c'
    command:
      - "ls -1 apps > sites/apps.txt; bench set-config -g db_host db; bench set-config -gp db_port 3306; bench set-config -g redis_cache redis://redis-cache:6379; bench set-config -g redis_queue redis://redis-queue:6379; bench set-config -g redis_socketio redis://redis-queue:6379; bench set-config -gp socketio_port 9000; bench set-config -g chromium_path /usr/bin/chromium-headless-shell; echo \"Configuration Complete\";\n"
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'
      - 'logs:/home/frappe/frappe-bench/logs'

  create-site:
    image: '${FRAPPE_IMAGE:-ghcr.io/igormarinsantos/erp-tecponto:version-16}'
    pull_policy: always
    deploy:
      restart_policy:
        condition: none
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'
      - 'logs:/home/frappe/frappe-bench/logs'
    environment:
      # Coolify Compose Empty does not reliably expand the ${VAR:?message}
      # form into service environments. This must be the literal production
      # site name so Frappe and Nginx always agree on the same tenant.
      SITE_NAME: 'erp.tecponto.sbs'
      ADMIN_PASSWORD: '${SERVICE_PASSWORD_ADMIN}'
      DB_ROOT_PASSWORD: '${SERVICE_PASSWORD_DB}'
    entrypoint:
      - bash
      - '-c'
    command:
      - |
        set -eu
        wait-for-it -t 120 db:3306
        wait-for-it -t 120 redis-cache:6379
        cd /home/frappe/frappe-bench
        if [ ! -d "sites/$${SITE_NAME}" ]; then
          echo "Site $${SITE_NAME} does not exist. Creating now..."
          bench new-site "$${SITE_NAME}" \
            --mariadb-root-password "$${DB_ROOT_PASSWORD}" \
            --db-root-username root \
            --admin-password "$${ADMIN_PASSWORD}" \
            --mariadb-user-host-login-scope '%' \
            --install-app erpnext \
            --set-default
          echo "Site created successfully."
        else
          echo "Site $${SITE_NAME} already exists. Skipping creation."
        fi
        if ! bench --site "$${SITE_NAME}" list-apps | grep -qx hrms; then
          bench --site "$${SITE_NAME}" install-app hrms
        fi
        ./env/bin/python - "$${SITE_NAME}" <<'PY'
        import frappe
        import os
        import sys

        sites_path = "/home/frappe/frappe-bench/sites"
        os.chdir(sites_path)
        frappe.init(site=sys.argv[1], sites_path=sites_path)
        frappe.connect()
        frappe.set_user("Administrator")
        if not frappe.db.exists("Company", "Tecponto"):
            from frappe.desk.page.setup_wizard.setup_wizard import setup_complete
            setup_complete('{"country":"Brazil","company_name":"Tecponto","company_abbr":"TEC","currency":"BRL","timezone":"America/Sao_Paulo","fy_start_date":"2026-01-01","fy_end_date":"2026-12-31","chart_of_accounts":"Standard"}')
        from tecponto_app.install import bootstrap_erpnext_foundation
        bootstrap_erpnext_foundation()
        frappe.db.commit()
        frappe.destroy()
        PY
        if ! bench --site "$${SITE_NAME}" list-apps | grep -qx tecponto_app; then
          bench --site "$${SITE_NAME}" install-app tecponto_app
        fi
        bench --site "$${SITE_NAME}" execute tecponto_app.install.after_install
        bench --site "$${SITE_NAME}" migrate
        echo "Tecponto site bootstrap complete."
    depends_on:
      configure:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  backend:
    image: '${FRAPPE_IMAGE:-ghcr.io/igormarinsantos/erp-tecponto:version-16}'
    pull_policy: always
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'
      - 'logs:/home/frappe/frappe-bench/logs'
    depends_on:
      configure:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  frontend:
    image: '${FRAPPE_IMAGE:-ghcr.io/igormarinsantos/erp-tecponto:version-16}'
    pull_policy: always
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: 'backend:8000'
      SOCKETIO: 'websocket:9000'
      FRAPPE_SITE_NAME_HEADER: 'erp.tecponto.sbs'
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: 'off'
      PROXY_READ_TIMEOUT: 300
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'
      - 'logs:/home/frappe/frappe-bench/logs'
    labels:
      - traefik.enable=true
      - traefik.http.routers.tecponto-router.rule=Host(`erp.tecponto.sbs`)
      - traefik.http.routers.tecponto-router.entryPoints=https
      - traefik.http.routers.tecponto-router.tls=true
      - traefik.http.routers.tecponto-router.tls.certresolver=letsencrypt
      - traefik.http.services.tecponto-frontend.loadbalancer.server.port=8080
    depends_on:
      backend:
        condition: service_started

  websocket:
    image: '${FRAPPE_IMAGE:-ghcr.io/igormarinsantos/erp-tecponto:version-16}'
    pull_policy: always
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'
      - 'logs:/home/frappe/frappe-bench/logs'
    depends_on:
      configure:
        condition: service_completed_successfully

  queue-long:
    image: '${FRAPPE_IMAGE:-ghcr.io/igormarinsantos/erp-tecponto:version-16}'
    pull_policy: always
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - bench
      - worker
      - '--queue'
      - 'long,default,short'
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'
      - 'logs:/home/frappe/frappe-bench/logs'
    depends_on:
      configure:
        condition: service_completed_successfully

  queue-short:
    image: '${FRAPPE_IMAGE:-ghcr.io/igormarinsantos/erp-tecponto:version-16}'
    pull_policy: always
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - bench
      - worker
      - '--queue'
      - 'short,default'
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'
      - 'logs:/home/frappe/frappe-bench/logs'
    depends_on:
      configure:
        condition: service_completed_successfully

  scheduler:
    image: '${FRAPPE_IMAGE:-ghcr.io/igormarinsantos/erp-tecponto:version-16}'
    pull_policy: always
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - bench
      - schedule
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'
      - 'logs:/home/frappe/frappe-bench/logs'
    depends_on:
      configure:
        condition: service_completed_successfully

  db:
    image: '${MARIADB_IMAGE:-mariadb:10.6}'
    command:
      - '--character-set-server=utf8mb4'
      - '--collation-server=utf8mb4_unicode_ci'
      - '--skip-character-set-client-handshake'
      - '--skip-innodb-read-only-compressed'
    environment:
      MYSQL_ROOT_PASSWORD: '${SERVICE_PASSWORD_DB}'
      MARIADB_ROOT_PASSWORD: '${SERVICE_PASSWORD_DB}'
    volumes:
      - 'db-data:/var/lib/mysql'
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - '-h'
        - localhost
        - '--password=${SERVICE_PASSWORD_DB}'
      interval: 5s
      retries: 20

  redis-cache:
    image: '${REDIS_IMAGE:-redis:6.2-alpine}'
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      retries: 5

  redis-queue:
    image: '${REDIS_IMAGE:-redis:6.2-alpine}'
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      retries: 5

volumes:
  db-data:
  sites:
  logs:
